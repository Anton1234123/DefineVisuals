plugins {
    id 'fabric-loom' version '1.12.7'
    id 'maven-publish'
}

group = 'moscow.definevisuals'
version = '1.0.0'

base {
    archivesName = 'definevisuals'
}

// 3. Репозитории для поиска зависимостей мода
repositories {
    maven { url = 'https://fabricmc.net' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // maven { url 'https://shedaniel.me' } // Repository unavailable
    maven { url 'https://terraformersmc.com' }
    flatDir {
        dirs 'libs'
    }
}

// 4. Все ваши зависимости и вложенные библиотеки (include)
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.8:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    compileOnly "javax.annotation:javax.annotation-api:1.3.2"

    implementation "com.google.zxing:core:3.5.3"
    implementation "com.google.zxing:javase:3.5.3"
    include "com.google.zxing:core:3.5.3"
    include "com.google.zxing:javase:3.5.3"

    // Дополнительные библиотеки
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    include "org.nanohttpd:nanohttpd:2.3.1"
    implementation "ai.catboost:catboost-prediction:1.2.7"
    include "ai.catboost:catboost-prediction:1.2.7"

    // Принудительно заставляем среду разработки видеть наш скачанный DLL внутри ресурсов
    runtimeOnly files("src/main/resources")

    // Media Player Info
    implementation "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"
    include "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    include "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    // Встроенный сторонний мод
    modImplementation name: 'chat_heads-0.13.8-fabric-1.21.4', ext: 'jar'
    include name: 'chat_heads-0.13.8-fabric-1.21.4', ext: 'jar'
}

loom {
    accessWidenerPath = file('src/main/resources/definevisuals.accesswidener')
}

// Include native libraries
tasks.withType(ProcessResources).configureEach {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// 5. Настройка Java 21 под Minecraft 1.21.4
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.incremental = true
}